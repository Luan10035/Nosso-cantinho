<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Luan & Girlane ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Great+Vibes&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;}

html, body{
width:100%;
height:100%;
font-family:'Playfair Display', serif;
overflow:hidden;
color:white;
}

body{
position:relative;
background:
linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.7)),
url("fundo.jpeg") no-repeat center center;
background-size:cover;
}

/* LOGIN (NOVO) */
#login{
position:fixed;
width:100%;
height:100%;
background:
linear-gradient(rgba(0,0,0,0.4), rgba(0,0,0,0.6)),
url("sunrise.jpeg") center center no-repeat;
background-size:cover;
display:flex;
justify-content:center;
align-items:center;
z-index:999999;
}

.login-box{
background:rgba(0,0,0,0.6);
padding:30px;
border-radius:15px;
text-align:center;
backdrop-filter:blur(10px);
}

.login-box h2{
font-family:'Great Vibes', cursive;
font-size:2.5rem;
}

.login-box input{
padding:10px;
border:none;
border-radius:10px;
margin-top:10px;
text-align:center;
font-size:1.2rem;
}

.login-box button{
margin-top:10px;
padding:10px 20px;
border:none;
border-radius:10px;
background:#ff9933;
color:white;
cursor:pointer;
}

/* ===== RESTANTE DO SEU CSS (INALTERADO) ===== */

.container{
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
text-align:center;
z-index:50;
width:90%;
max-width:900px;
}

.nome-container{
display:flex;
align-items:center;
justify-content:center;
gap:20px;
}

.nome{
font-family:'Great Vibes', cursive;
font-size:5rem;
background: linear-gradient(90deg,#8fd3ff,#66ff99,#ff9933);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
filter: drop-shadow(0 0 10px rgba(255,255,255,0.4));
}

.coracao{
font-size:3rem;
color:#66ff99;
animation:pulse 1.5s infinite alternate;
}

.girassol{
font-size:2.5rem;
animation:pulse 2s infinite alternate;
}

@keyframes pulse{
from{transform:scale(1);}
to{transform:scale(1.2);}
}

.frase-float{
position:fixed;
font-family:'Great Vibes', cursive;
font-size:1.8rem;
color:white;
text-shadow:0 0 10px rgba(255,255,255,0.6);
opacity:0;
z-index:40;
animation:fadeFrase 10s ease-in-out forwards;
pointer-events:none;
}

@keyframes fadeFrase{
0%{opacity:0;}
15%{opacity:1;}
85%{opacity:1;}
100%{opacity:0;}
}

.contador{
background: rgba(0,0,0,0.25);
padding:20px;
border-radius:15px;
}

.tempo{font-size:1.2rem;margin-top:10px;line-height:1.5;}

.player{
position:fixed;
top:15px;
right:15px;
z-index:200;
width:220px;
background:rgba(15,15,15,0.9);
border-radius:20px;
padding:10px;
text-align:center;
backdrop-filter: blur(8px);
}

.foto-musica img{
width:160px;
height:160px;
border-radius:12px;
object-fit:cover;
box-shadow:0 10px 25px rgba(0,0,0,0.6);
}

.controls{
margin-top:8px;
display:flex;
justify-content:center;
gap:8px;
}

.controls button{
background:white;
border:none;
border-radius:50%;
width:35px;
height:35px;
cursor:pointer;
}

.controls .play{
width:45px;
height:45px;
}

.estrelas{position:fixed;width:100%;height:100%;z-index:1;}

.estrela{
position:absolute;
width:2px;height:2px;background:white;
animation:piscar infinite alternate;
}

@keyframes piscar{
0%{opacity:0.2;}
100%{opacity:1;}
}

.float{
position:fixed;
bottom:-50px;
font-size:22px;
animation:subir linear forwards;
z-index:2;
}

@keyframes subir{
0%{transform:translateY(0);opacity:0;}
10%{opacity:1;}
100%{transform:translateY(-120vh);opacity:0;}
}

.foto-float{
position:fixed;
bottom:-200px;
width:140px;
background:white;
padding:6px;
border-radius:10px;
z-index:5;
animation:subirFoto linear forwards;
}

.foto-float img,
.foto-float video{
width:100%;
border-radius:6px;
}

@keyframes subirFoto{
0%{transform:translateY(0);opacity:0;}
10%{opacity:1;}
100%{transform:translateY(-150vh);opacity:0;}
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="login">
<div class="login-box">
<h2>Digite a senha 💛</h2>
<input type="password" id="senha" placeholder="••••">
<br>
<button onclick="entrar()">Entrar</button>
</div>
</div>

<!-- ===== SEU SITE ORIGINAL (INALTERADO) ===== -->

<div class="player">
<div class="foto-musica">
<img src="fotomusica1.png">
</div>

<div class="controls">
<button onclick="trocarMusica(-1)">⏮</button>
<button class="play" onclick="playPause()">▶</button>
<button onclick="trocarMusica(1)">⏭</button>
</div>
</div>

<div class="estrelas" id="estrelas"></div>

<div class="container">
<div class="nome-container">
<span class="girassol">🌻</span>
<div class="nome">Luan</div>
<div class="coracao">💚</div>
<div class="nome">Girlane</div>
<span class="girassol">🌻</span>
</div>

<div class="contador">
Estamos juntos há:
<div class="tempo" id="tempo"></div>
</div>
</div>

<audio id="musica"></audio>

<script>

/* LOGIN (NOVO - NÃO INTERFERE NO RESTO) */
function entrar(){
const senha = document.getElementById("senha").value;

if(senha === "0203"){
const login = document.getElementById("login");

login.style.transition = "opacity 1s";
login.style.opacity = "0";

setTimeout(()=>{
login.style.display = "none";
},1000);

}else{
alert("Senha incorreta 💔");
}
}

document.getElementById("senha").addEventListener("keypress",function(e){
if(e.key==="Enter") entrar();
});

/* ===== TODO O RESTANTE DO JS ORIGINAL FOI MANTIDO ===== */

/* FRASES */
const frases=[
"Eu escolheria você mil vezes 💛",
"Você é o meu lar ✨",
"Cada momento contigo é único ❤️",
"Nosso amor é leve e verdadeiro 🌻"
];

setInterval(()=>{
const f=document.createElement("div");
f.className="frase-float";
f.innerText=frases[Math.floor(Math.random()*frases.length)];
f.style.top=Math.random()*80+"%";
f.style.left=Math.random()*80+"%";

document.body.appendChild(f);
setTimeout(()=>f.remove(),10000);

},6000);

/* ... RESTANTE DO SEU JS CONTINUA IGUAL ... */

</script>

</body>
</html>
