<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nosso Cantinho ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Great+Vibes&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
height:100vh;
overflow:hidden;
display:flex;
justify-content:center;
align-items:center;
color:white;
font-family:'Playfair Display', serif;
position:relative;
background:linear-gradient(135deg,#ff4e8a,#ff8fb1);
}

/* FUNDO */
body::before{
content:"";
position:absolute;
top:0;left:0;
width:100%;height:100%;
background-size:70%;
opacity:0.22;
filter:blur(1.5px);
z-index:0;
}

/* LOGIN */
#login{
position:absolute;
width:100%;height:100%;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#ff4e8a,#ff8fb1);
z-index:20;
}

#login h2{
font-family:'Great Vibes', cursive;
font-size:2.5rem;
}

#login input{
padding:12px;
border:none;
border-radius:8px;
margin-top:10px;
font-size:16px;
}

#login button{
margin-top:10px;
padding:10px 20px;
border:none;
border-radius:8px;
cursor:pointer;
background:white;
color:#ff4e8a;
font-weight:bold;
}

/* SITE */
#site{
display:none;
flex-direction:column;
align-items:center;
text-align:center;
z-index:5;
position:relative;
padding:20px;
}

h1{
font-family:'Great Vibes', cursive;
font-size:4rem;
margin-bottom:20px;
text-shadow:0 5px 20px rgba(0,0,0,0.3);
}

.contador{
font-size:1.8rem;
background:rgba(255,255,255,0.25);
padding:40px;
border-radius:20px;
backdrop-filter:blur(10px);
box-shadow:0 10px 30px rgba(0,0,0,0.3);
}

.tempo{
margin-top:15px;
font-size:2rem;
font-weight:bold;
}

/* FRASES */
.frase{
position:absolute;
top:12%;
font-family:'Great Vibes', cursive;
font-size:2rem;
opacity:0;
animation:fadeFrase 8s ease-in-out;
text-align:center;
max-width:85%;
}

@keyframes fadeFrase{
0%{opacity:0;}
20%{opacity:1;}
80%{opacity:1;}
100%{opacity:0;}
}

/* CORAÇÕES */
.heart{
position:absolute;
bottom:-100px;
font-size:30px;
animation:floatUp linear forwards;
}

/* POLAROID */
.foto{
position:absolute;
bottom:-200px;
width:200px;
background:white;
padding:10px;
border-radius:10px;
animation:floatUp linear forwards;
}

.foto img{width:100%;border-radius:8px;}

@keyframes floatUp{
0%{transform:translateY(0);opacity:0;}
10%{opacity:1;}
100%{transform:translateY(-120vh);opacity:0;}
}

/* MOBILE */
@media (max-width:768px){
body::before{background-size:110%;}
h1{font-size:2.8rem;}
.contador{padding:25px;font-size:1.2rem;}
.tempo{font-size:1.5rem;}
.frase{font-size:1.6rem;}
.foto{width:140px;}
}
</style>
</head>

<body>

<div id="login">
<h2>Digite a senha ❤️</h2>
<input type="password" id="senha" placeholder="Senha">
<button onclick="verificarSenha()">Entrar</button>
<p id="erro"></p>
</div>

<div id="site">
<h1>Luan & ❤️</h1>
<div class="contador">
Estamos juntos há:
<div class="tempo" id="tempo"></div>
</div>
</div>

<audio id="musica" loop preload="auto">
<source src="musica.mp3" type="audio/mp3">
</audio>

<script>

/* LOGIN */
function verificarSenha(){

document.getElementById("login").style.display="none";
document.getElementById("site").style.display="flex";

musica.play();

iniciarFotos();
iniciarFrases();
}else{
document.getElementById("erro").innerText="Senha incorreta 😢";
}
}
