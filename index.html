<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Luan & Girlane ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Great+Vibes&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
font-family:'Playfair Display', serif;
color:white;
overflow:hidden;
position:relative;
opacity:0;
animation:fadeIn 2s ease forwards;
}

@keyframes fadeIn{to{opacity:1;}}

body::before{
content:"";
position:absolute;
width:100%;
height:100%;
background:
linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.7)),
url("fundo.jpeg") center center no-repeat;
background-size:cover;
z-index:0;
}

/* 🎵 PLAYER (INTACTO) */
.player{
position:fixed;
top:20px;
right:20px;
z-index:200;
width:230px;
background:#111;
border-radius:18px;
padding:12px;
box-shadow:0 10px 30px rgba(0,0,0,0.6);
text-align:center;
}

.foto-musica{
position:relative;
display:flex;
justify-content:center;
margin-bottom:10px;
}

.foto-musica img{
width:170px;
height:170px;
object-fit:cover;
clip-path: path("M85 150 L20 80 A35 35 0 1 1 85 40 A35 35 0 1 1 150 80 Z");
}

.player .controls{
position:absolute;
bottom:75px;
left:50%;
transform:translateX(-50%);
display:flex;
align-items:center;
gap:18px;
}

.player .controls button{
background:white;
border:none;
border-radius:50%;
width:40px;
height:40px;
cursor:pointer;
font-size:16px;
}

.player .controls .play{
width:55px;
height:55px;
font-size:20px;
}

.player .titulo{
font-size:14px;
font-weight:bold;
margin-top:10px;
}

.player .artista{
font-size:12px;
opacity:0.7;
}

/* ⭐ ESTRELAS */
.estrelas{position:fixed;width:100%;height:100%;z-index:1;}

.estrela{
position:absolute;
width:2px;
height:2px;
border-radius:50%;
background:white;
animation:piscar infinite alternate;
}

/* animação corrigida */
@keyframes piscar{
0%{opacity:0.2;}
100%{opacity:1;}
}

/* ❤️🌻 FLOAT */
.float{
position:fixed;
bottom:-20px;
font-size:32px;
animation:subir linear forwards;
z-index:2;
pointer-events:none;
}

@keyframes subir{
0%{transform:translateY(0);opacity:0;}
10%{opacity:1;}
100%{transform:translateY(-130vh);opacity:0;}
}

/* RESTO INTACTO */
.container{text-align:center;z-index:50;position:relative;}

.nome-container{display:flex;align-items:center;justify-content:center;gap:26px;margin-bottom:45px;}

.nome{
font-family:'Great Vibes', cursive;
font-size:5rem;
letter-spacing:2px;
background: linear-gradient(90deg,#66c2ff,#66ff99,#ff9933);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

.coracao{margin:0 10px;}

.girassol{
font-size:3rem;
filter: drop-shadow(0 0 10px rgba(255,200,0,0.8));
animation:pulse 2s infinite alternate;
}

@keyframes pulse{from{transform:scale(1);}to{transform:scale(1.2);}}

.contador{
background: rgba(10,10,10,0.15);
backdrop-filter: blur(2px);
padding:25px;border-radius:15px;
border:1px solid rgba(255,255,255,0.25);
z-index:100;
}

.tempo{font-size:1.5rem;margin-top:10px;}

.foto-float{
position:fixed;
bottom:-200px;
width:190px;
background:white;
padding:8px;
border-radius:8px;
box-shadow:0 20px 40px rgba(0,0,0,0.7);
z-index:10;
animation:subirFoto linear forwards;
}

.foto-float img{width:100%;border-radius:6px;}

@keyframes subirFoto{
0%{transform:translateY(0);opacity:0;}
10%{opacity:1;}
100%{transform:translateY(-140vh);opacity:1;}
}

.frase{
position:fixed;
font-family:'Great Vibes', cursive;
font-size:1.9rem;
opacity:0;
animation:fadeMove 15s ease-in-out forwards;
z-index:3;
max-width:280px;
text-align:center;
}

.frase-pequena{
font-size:1.4rem;
max-width:320px;
}

@keyframes fadeMove{
0%{opacity:0;}
20%{opacity:1;}
80%{opacity:1;}
100%{opacity:0;}
}

</style>
</head>

<body>

<div class="player">
<div class="foto-musica">
<img src="fotomusica1.jpg">
</div>

<div class="controls">
<button onclick="trocarMusica(-1)">⏮</button>
<button class="play" onclick="playPause()">▶</button>
<button onclick="trocarMusica(1)">⏭</button>
</div>

<div class="titulo">Lu e Gi</div>
<div class="artista">Juntos para sempre</div>
</div>

<div class="estrelas" id="estrelas"></div>

<div class="container">
<div class="nome-container">
<span class="girassol">🌻</span>
<div class="nome">Luan <span class="coracao">❤️</span> Girlane</div>
<span class="girassol">🌻</span>
</div>

<div class="contador">
Estamos juntos há:
<div class="tempo" id="tempo"></div>
</div>
</div>

<audio id="musica"></audio>

<script>

/* ⭐ ESTRELAS DINÂMICAS */
function gerarEstrelas(){
const container=document.getElementById("estrelas");
container.innerHTML="";

for(let i=0;i<80;i++){
const e=document.createElement("div");
e.className="estrela";

e.style.top=Math.random()*100+"%";
e.style.left=Math.random()*100+"%";

const size=Math.random()*2+1;
e.style.width=size+"px";
e.style.height=size+"px";

e.style.animationDuration=(1.5 + Math.random()*2)+"s";

container.appendChild(e);
}
}

gerarEstrelas();
setInterval(gerarEstrelas,15000);

/* ❤️🌻 FLOAT */
const simbolos=["❤️","🌻"];

function criarFloat(){
const el=document.createElement("div");
el.className="float";

el.innerHTML=simbolos[Math.floor(Math.random()*simbolos.length)];
el.style.left=(10 + Math.random()*80)+"vw";
el.style.animationDuration=(10 + Math.random()*5)+"s";

document.body.appendChild(el);
setTimeout(()=>el.remove(),15000);
}

setInterval(criarFloat,1200);

/* CONTADOR */
const dataInicio=new Date("2026-03-02");

function atualizarTempo(){
const agora=new Date();
let diff=agora-dataInicio;

const anos=Math.floor(diff/(365.25*24*3600*1000));
diff%=(365.25*24*3600*1000);

const meses=Math.floor(diff/(30.44*24*3600*1000));
diff%=(30.44*24*3600*1000);

const dias=Math.floor(diff/(24*3600*1000));
diff%=(24*3600*1000);

const horas=Math.floor(diff/(3600*1000));
diff%=(3600*1000);

const minutos=Math.floor(diff/(60*1000));
diff%=(60*1000);

const segundos=Math.floor(diff/1000);

document.getElementById("tempo").innerHTML=
`${anos} anos, ${meses} meses, ${dias} dias<br>
${horas}h ${minutos}m ${segundos}s`;
}

setInterval(atualizarTempo,1000);

/* FRASES */
let fraseAtiva=false;
let indexFrase=0;

const posicoesFrases=[
{top:"5%", left:"5%"},
{top:"5%", right:"5%"},
{bottom:"10%", left:"5%"},
{bottom:"10%", right:"5%"}
];

const frases=[
"Entre todos os girassóis do mundo, nenhum brilha mais do que o teu sorriso 🌻",
"Você não é só parte dos meus dias… você é o melhor deles ❤️",
"O mundo pode ser grande… mas nada nele me faz sentir tão completo quanto você 💫",
"Eu não sei exatamente em que momento você deixou de ser só alguém especial e virou alguém essencial pra mim… mas sei que, desde então, tudo ficou mais leve."
];

const fraseEspecial=`Eu não preciso de muito pra saber o que eu sinto...

Eu quero você comigo.`;

let contadorFrase=0;

function criarFrase(){

if(fraseAtiva) return;

fraseAtiva=true;

const f=document.createElement("div");

if(contadorFrase % 5 === 0){
f.className="frase frase-pequena";
f.innerText=fraseEspecial;
}else{
f.className="frase";
f.innerText=frases[Math.floor(Math.random()*frases.length)];
}

contadorFrase++;

const pos=posicoesFrases[indexFrase];
indexFrase=(indexFrase+1)%posicoesFrases.length;

for(let key in pos){
f.style[key]=pos[key];
}

document.body.appendChild(f);

setTimeout(()=>{
f.remove();
fraseAtiva=false;
},15000);
}

setInterval(criarFrase,7000);

/* MÚSICA */
const playlist=["musica1.mp3","musica2.mp3"];
let musicaIndex=0;
let tocando=false;

const musica=document.getElementById("musica");

function playPause(){
if(tocando){
musica.pause();
tocando=false;
}else{
musica.play();
tocando=true;
}
}

function trocarMusica(dir){
musicaIndex=(musicaIndex+dir+playlist.length)%playlist.length;
musica.src=playlist[musicaIndex];
musica.play();
tocando=true;
}

musica.src=playlist[0];
musica.volume=0.3;

musica.play().then(()=>tocando=true).catch(()=>{
document.body.addEventListener("click",()=>{
musica.play();
tocando=true;
},{once:true});
});

</script>

</body>
</html>
