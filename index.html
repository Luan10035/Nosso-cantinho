<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Luan & Girlane ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Great+Vibes&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
font-family:'Playfair Display', serif;
color:white;
overflow:hidden;
position:relative;
opacity:0;
animation:fadeIn 2s ease forwards;
}

@keyframes fadeIn{to{opacity:1;}}

/* FUNDO */
body::before{
content:"";
position:absolute;
width:100%;
height:100%;
background:
linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.7)),
url("fundo.jpeg") center center no-repeat;
background-size:cover;
z-index:0;
}

/* ESTRELAS */
.estrelas{
position:fixed;
width:100%;
height:100%;
z-index:1;
}

.estrela{
position:absolute;
width:2px;
height:2px;
border-radius:50%;
background:white;
animation:piscar 2s infinite alternate;
}

@keyframes piscar{
from{opacity:0.2;}
to{opacity:1;}
}

/* CONTAINER */
.container{
text-align:center;
z-index:50;
position:relative;
}

/* NOME */
.nome-container{
display:flex;
align-items:center;
justify-content:center;
gap:15px;
margin-bottom:40px;
}

.nome{
font-family:'Great Vibes', cursive;
font-size:4.2rem;
background: linear-gradient(90deg, #66c2ff, #66ff99, #ff9933);
-webkit-background-clip: text;
-webkit-text-fill-color: transparent;
}

.girassol{
font-size:2.2rem;
animation:pulse 2s infinite alternate;
}

@keyframes pulse{
from{transform:scale(1);}
to{transform:scale(1.1);}
}

/* CONTADOR */
.contador{
background: rgba(10,10,10,0.15);
backdrop-filter: blur(2px);
padding:25px;
border-radius:15px;
border:1px solid rgba(255,255,255,0.25);
z-index:100;
position:relative;
}

.tempo{
font-size:1.4rem;
margin-top:10px;
}

/* FLOAT ICONS */
.float{
position:fixed;
bottom:-20px;
font-size:22px;
animation:subir linear forwards;
z-index:2;
pointer-events:none;
}

/* 📸 POLAROID AJUSTADO */
.foto-float{
position:fixed;
bottom:-200px;
width:170px;
background:white;
padding:8px;
border-radius:8px;
box-shadow:0 12px 25px rgba(0,0,0,0.6);
animation:subir linear forwards;
z-index:2;
pointer-events:none;
}

.foto-float img{
width:100%;
height:auto;
border-radius:6px;
}

/* ANIMAÇÃO CORRIGIDA */
@keyframes subir{
0%{transform:translateY(0);opacity:0;}
10%{opacity:1;}
100%{transform:translateY(-140vh);opacity:1;}
}

/* FRASES */
.frase{
position:fixed;
font-family:'Great Vibes', cursive;
font-size:1.5rem;
opacity:0;
animation:fadeMove 15s ease-in-out forwards;
z-index:3;
}

@keyframes fadeMove{
0%{opacity:0;}
20%{opacity:1;}
80%{opacity:1;}
100%{opacity:0;}
}

</style>
</head>

<body>

<div class="estrelas" id="estrelas"></div>

<div class="container">
<div class="nome-container">
<span class="girassol">🌻</span>
<div class="nome">Luan & Girlane</div>
<span class="girassol">🌻</span>
</div>

<div class="contador">
Estamos juntos há:
<div class="tempo" id="tempo"></div>
</div>
</div>

<audio id="musica" loop src="musica1.mp3"></audio>

<script>

/* ESTRELAS */
for(let i=0;i<80;i++){
const e=document.createElement("div");
e.className="estrela";
e.style.top=Math.random()*100+"%";
e.style.left=Math.random()*100+"%";
document.getElementById("estrelas").appendChild(e);
}

/* CONTADOR */
const dataInicio=new Date("2026-03-02");

function atualizarTempo(){
const agora=new Date();
let diff=agora-dataInicio;

const anos=Math.floor(diff/(365.25*24*3600*1000));
diff%=(365.25*24*3600*1000);

const meses=Math.floor(diff/(30.44*24*3600*1000));
diff%=(30.44*24*3600*1000);

const dias=Math.floor(diff/(24*3600*1000));
diff%=(24*3600*1000);

const horas=Math.floor(diff/(3600*1000));
diff%=(3600*1000);

const minutos=Math.floor(diff/(60*1000));
diff%=(60*1000);

const segundos=Math.floor(diff/1000);

document.getElementById("tempo").innerHTML=
`${anos} anos, ${meses} meses, ${dias} dias<br>
${horas}h ${minutos}m ${segundos}s`;
}

setInterval(atualizarTempo,1000);

/* FLOAT ICONS */
const simbolos=["❤️","🌻"];

function criarFloat(){
const el=document.createElement("div");
el.className="float";
el.innerHTML=simbolos[Math.floor(Math.random()*simbolos.length)];
el.style.left=Math.random()*100+"vw";
el.style.animationDuration=(10+Math.random()*5)+"s";
document.body.appendChild(el);
setTimeout(()=>el.remove(),15000);
}
setInterval(criarFloat,1200);

/* 📸 FOTOS */
const fotos=["foto1.jpeg","foto2.jpeg","foto3.jpeg","foto4.jpeg","foto5.jpeg","foto6.jpeg","foto7.jpeg"];

function criarFoto(){
const div=document.createElement("div");
div.className="foto-float";

/* laterais */
const lado=Math.random()<0.5 ? Math.random()*20 : 80+Math.random()*20;
div.style.left=lado+"vw";

/* tempo mais suave */
div.style.animationDuration=(18+Math.random()*6)+"s";

div.innerHTML=`<img src="${fotos[Math.floor(Math.random()*fotos.length)]}">`;

document.body.appendChild(div);

/* remove só depois que sair da tela */
setTimeout(()=>div.remove(),26000);
}

setInterval(criarFoto,6000);

/* FRASES */
const frases=[
"Entre todos os girassóis do mundo, nenhum brilha mais do que o teu sorriso 🌻",
"Você não é só parte dos meus dias… você é o melhor deles ❤️",
"O mundo pode ser grande… mas nada nele me faz sentir tão completo quanto você 💫"
];

function criarFrase(){
const f=document.createElement("div");
f.className="frase";
f.innerText=frases[Math.floor(Math.random()*frases.length)];

f.style.top=Math.random()*80+"vh";
f.style.left=Math.random()*80+"vw";

document.body.appendChild(f);
setTimeout(()=>f.remove(),15000);
}

setInterval(criarFrase,6000);

/* 🎵 MÚSICA */
const musica=document.getElementById("musica");
musica.volume=0.3;

musica.play().catch(()=>{
document.body.addEventListener("click",()=>{
musica.play();
},{once:true});
});

</script>

</body>
</html>
