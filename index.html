<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Luan & Girlane ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Great+Vibes&display=swap" rel="stylesheet">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:#000; /* FUNDO PRETO */
font-family:'Playfair Display', serif;
color:white;
}

/* LOGIN */
#login{
position:absolute;
width:100%;
height:100%;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
background:#000; /* PRETO */
}

#login h2{
font-family:'Great Vibes', cursive;
font-size:2.5rem;
margin-bottom:10px;
}

#login input{
padding:10px;
border:none;
border-radius:8px;
margin-top:10px;
background:#111;
color:white;
}

#login button{
margin-top:10px;
padding:10px 20px;
border:none;
border-radius:8px;
background:white;
color:black;
font-weight:bold;
cursor:pointer;
}

/* SITE */
#site{
display:none;
flex-direction:column;
align-items:center;
text-align:center;
}

h1{
font-family:'Great Vibes', cursive;
font-size:3.5rem;
margin-bottom:20px;
}

.contador{
background:rgba(255,255,255,0.1);
padding:30px;
border-radius:20px;
font-size:1.5rem;
border:1px solid rgba(255,255,255,0.2);
}

.tempo{
margin-top:15px;
font-size:2rem;
font-weight:bold;
}
</style>
</head>

<body>

<div id="login">
<h2>Digite a senha ❤️</h2>
<input type="password" id="senha" placeholder="Senha">
<button onclick="verificarSenha()">Entrar</button>
<p id="erro"></p>
</div>

<div id="site">
<h1>Luan & Girlane ❤️</h1>
<div class="contador">
Estamos juntos há:
<div class="tempo" id="tempo"></div>
</div>
</div>

<script>

/* LOGIN */
function verificarSenha(){
if(document.getElementById("senha").value==="luanegirlane"){
document.getElementById("login").style.display="none";
document.getElementById("site").style.display="flex";
}else{
document.getElementById("erro").innerText="Senha incorreta 😢";
}
}

/* DATA */
const dataInicio=new Date("2026-03-02");

/* CONTADOR */
function atualizarTempo(){
const agora=new Date();
const diff=Math.floor((agora-dataInicio)/1000);

const anos=Math.floor(diff/(365.25*24*3600));
const meses=Math.floor((diff%(365.25*24*3600))/(30.44*24*3600));
const dias=Math.floor((diff%(30.44*24*3600))/(24*3600));
const horas=Math.floor((diff%(24*3600))/3600);
const minutos=Math.floor((diff%3600)/60);
const segundos=diff%60;

document.getElementById("tempo").innerHTML =
`${anos} anos, ${meses} meses, ${dias} dias<br>
${horas}h ${minutos}m ${segundos}s`;
}

setInterval(atualizarTempo,1000);
atualizarTempo();

</script>

</body>
</html>
