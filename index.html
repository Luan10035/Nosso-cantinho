<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Luan & Girlane ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Great+Vibes&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;}

html, body{
width:100%;
height:100%;
font-family:'Playfair Display', serif;
overflow:hidden;
color:white;
}

/* ================= LOGIN ================= */
.login-screen{
position:fixed;
width:100%;
height:100%;
background:
linear-gradient(rgba(0,0,0,0.4), rgba(0,0,0,0.6)),
url("sunrise.jpeg") center center no-repeat;
background-size:cover;
display:flex;
justify-content:center;
align-items:center;
z-index:9999;
transition:opacity 1.5s ease;
}

.login-box{
background:rgba(0,0,0,0.6);
padding:30px;
border-radius:15px;
text-align:center;
backdrop-filter:blur(10px);
}

.login-box h2{
font-family:'Great Vibes', cursive;
font-size:2.5rem;
margin-bottom:15px;
}

.login-box input{
padding:10px;
border:none;
border-radius:10px;
outline:none;
text-align:center;
font-size:1.2rem;
}

.login-box button{
margin-top:10px;
padding:10px 20px;
border:none;
border-radius:10px;
background:#ff9933;
color:white;
cursor:pointer;
}

/* ================= SITE ================= */
.site{
display:none;
height:100%;
width:100%;
}

/* ======= (TODO O SEU CÓDIGO ORIGINAL ABAIXO NÃO FOI ALTERADO) ======= */

body{
position:relative;
background:
linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.7)),
url("fundo.jpeg") no-repeat center center;
background-size:cover;
}

/* CONTAINER */
.container{
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
text-align:center;
z-index:50;
width:90%;
max-width:900px;
}

/* TÍTULO */
.nome-container{
display:flex;
align-items:center;
justify-content:center;
gap:20px;
}

.nome{
font-family:'Great Vibes', cursive;
font-size:5rem;
background: linear-gradient(90deg,#8fd3ff,#66ff99,#ff9933);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
filter: drop-shadow(0 0 10px rgba(255,255,255,0.4));
}

.coracao{
font-size:3rem;
color:#66ff99;
animation:pulse 1.5s infinite alternate;
}

.girassol{
font-size:2.5rem;
animation:pulse 2s infinite alternate;
}

@keyframes pulse{
from{transform:scale(1);}
to{transform:scale(1.2);}
}

/* FRASES */
.frase-float{
position:fixed;
font-family:'Great Vibes', cursive;
font-size:1.8rem;
color:white;
text-shadow:0 0 10px rgba(255,255,255,0.6);
opacity:0;
z-index:40;
animation:fadeFrase 10s ease-in-out forwards;
pointer-events:none;
}

@keyframes fadeFrase{
0%{opacity:0;}
15%{opacity:1;}
85%{opacity:1;}
100%{opacity:0;}
}

/* CONTADOR */
.contador{
background: rgba(0,0,0,0.25);
padding:20px;
border-radius:15px;
}

.tempo{font-size:1.2rem;margin-top:10px;line-height:1.5;}

/* PLAYER */
.player{
position:fixed;
top:15px;
right:15px;
z-index:200;
width:220px;
background:rgba(15,15,15,0.9);
border-radius:20px;
padding:10px;
text-align:center;
backdrop-filter: blur(8px);
}

.foto-musica img{
width:160px;
height:160px;
border-radius:12px;
object-fit:cover;
box-shadow:0 10px 25px rgba(0,0,0,0.6);
}

.controls{
margin-top:8px;
display:flex;
justify-content:center;
gap:8px;
}

.controls button{
background:white;
border:none;
border-radius:50%;
width:35px;
height:35px;
cursor:pointer;
}

.controls .play{
width:45px;
height:45px;
}

/* ESTRELAS */
.estrelas{position:fixed;width:100%;height:100%;z-index:1;}
.estrela{
position:absolute;
width:2px;height:2px;background:white;
animation:piscar infinite alternate;
}
@keyframes piscar{
0%{opacity:0.2;}
100%{opacity:1;}
}

/* FLOAT */
.float{
position:fixed;
bottom:-50px;
font-size:22px;
animation:subir linear forwards;
z-index:2;
}
@keyframes subir{
0%{transform:translateY(0);opacity:0;}
10%{opacity:1;}
100%{transform:translateY(-120vh);opacity:0;}
}

/* FOTOS */
.foto-float{
position:fixed;
bottom:-200px;
width:140px;
background:white;
padding:6px;
border-radius:10px;
z-index:5;
animation:subirFoto linear forwards;
}

.foto-float img,
.foto-float video{
width:100%;
border-radius:6px;
}

@keyframes subirFoto{
0%{transform:translateY(0);opacity:0;}
10%{opacity:1;}
100%{transform:translateY(-150vh);opacity:0;}
}
</style>
</head>

<body>

<!-- LOGIN -->
<div class="login-screen" id="login">
<div class="login-box">
<h2>Digite a senha 💛</h2>
<input type="password" id="senha" placeholder="••••">
<br>
<button onclick="entrar()">Entrar</button>
</div>
</div>

<!-- SITE -->
<div class="site" id="site">

<!-- (SEU SITE ORIGINAL INTACTO) -->

<div class="player">
<div class="foto-musica">
<img src="fotomusica1.png">
</div>

<div class="controls">
<button onclick="trocarMusica(-1)">⏮</button>
<button class="play" onclick="playPause()">▶</button>
<button onclick="trocarMusica(1)">⏭</button>
</div>
</div>

<div class="estrelas" id="estrelas"></div>

<div class="container">
<div class="nome-container">
<span class="girassol">🌻</span>
<div class="nome">Luan</div>
<div class="coracao">💚</div>
<div class="nome">Girlane</div>
<span class="girassol">🌻</span>
</div>

<div class="contador">
Estamos juntos há:
<div class="tempo" id="tempo"></div>
</div>
</div>

<audio id="musica"></audio>

</div>

<script>

/* LOGIN */
function entrar(){
const senha = document.getElementById("senha").value;

if(senha === "0203"){
document.getElementById("login").style.opacity = 0;

setTimeout(()=>{
document.getElementById("login").style.display = "none";
document.getElementById("site").style.display = "block";
},1500);

}else{
alert("Senha incorreta 💔");
}
}

/* PERMITIR ENTER */
document.getElementById("senha").addEventListener("keypress",function(e){
if(e.key==="Enter"){entrar();}
});

/* ===== SEU JS ORIGINAL (INALTERADO) ===== */

const frases=[
"Eu escolheria você mil vezes 💛",
"Você é o meu lar ✨",
"Cada momento contigo é único ❤️",
"Nosso amor é leve e verdadeiro 🌻"
];

setInterval(()=>{
const f=document.createElement("div");
f.className="frase-float";
f.innerText=frases[Math.floor(Math.random()*frases.length)];
f.style.top=Math.random()*80+"%";
f.style.left=Math.random()*80+"%";
document.body.appendChild(f);
setTimeout(()=>f.remove(),10000);
},6000);

const estrelas=document.getElementById("estrelas");
for(let i=0;i<80;i++){
let e=document.createElement("div");
e.className="estrela";
e.style.top=Math.random()*100+"%";
e.style.left=Math.random()*100+"%";
e.style.animationDuration=(1+Math.random()*2)+"s";
estrelas.appendChild(e);
}

setInterval(()=>{
let el=document.createElement("div");
el.className="float";
el.innerHTML=Math.random()>0.5?"❤️":"🌻";
el.style.left=Math.random()*100+"vw";
el.style.animationDuration=(8+Math.random()*5)+"s";
document.body.appendChild(el);
setTimeout(()=>el.remove(),15000);
},800);

const midias=[
"foto1.jpeg","foto2.jpeg","foto3.jpeg","foto4.jpeg","foto5.jpeg",
"foto6.jpeg","foto7.jpeg","foto8.jpeg","foto9.jpeg","foto10.jpeg",
"foto11.jpeg","foto12.jpeg","foto13.jpeg","foto14.jpeg","foto15.jpeg",
"video1.mp4"
];

setInterval(()=>{
let f=document.createElement("div");
f.className="foto-float";
f.style.left=(10+Math.random()*70)+"vw";
f.style.animationDuration=(10+Math.random()*5)+"s";

let arquivo=midias[Math.floor(Math.random()*midias.length)];

if(arquivo.includes(".mp4")){
let v=document.createElement("video");
v.src=arquivo;
v.autoplay=true;
v.loop=true;
v.muted=true;
f.appendChild(v);
}else{
let img=document.createElement("img");
img.src=arquivo;
img.onerror=()=>f.remove();
f.appendChild(img);
}

document.body.appendChild(f);
setTimeout(()=>f.remove(),18000);

},4000);

const inicio=new Date("2026-03-02T00:00:00");

function atualizar(){
const agora=new Date();

let anos=agora.getFullYear()-inicio.getFullYear();
let meses=agora.getMonth()-inicio.getMonth();
let dias=agora.getDate()-inicio.getDate();
let horas=agora.getHours()-inicio.getHours();
let minutos=agora.getMinutes()-inicio.getMinutes();
let segundos=agora.getSeconds()-inicio.getSeconds();

if(segundos<0){segundos+=60;minutos--;}
if(minutos<0){minutos+=60;horas--;}
if(horas<0){horas+=24;dias--;}
if(dias<0){
const ultimoMes=new Date(agora.getFullYear(),agora.getMonth(),0).getDate();
dias+=ultimoMes;
meses--;
}
if(meses<0){meses+=12;anos--;}

document.getElementById("tempo").innerHTML=
`${anos} anos, ${meses} meses, ${dias} dias<br>
${horas}h ${minutos}m ${segundos}s ❤️`;
}

setInterval(atualizar,1000);
atualizar();

const playlist=["musica1.mp3","musica2.mp3"];
let index=0;
const musica=document.getElementById("musica");

function tocar(){
musica.src=playlist[index];
musica.play().catch(()=>{});
}

function playPause(){
musica.paused?musica.play():musica.pause();
}

function trocarMusica(dir){
index=(index+dir+playlist.length)%playlist.length;
tocar();
}

musica.addEventListener("ended",()=>{
index=(index+1)%playlist.length;
tocar();
});

window.addEventListener("load",()=>{tocar();});

document.body.addEventListener("click",()=>{
if(musica.paused){musica.play();}
},{once:true});

</script>

</body>
</html>
