<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Luan & Girlane ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Great+Vibes&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
font-family:'Playfair Display', serif;
color:white;
overflow:hidden;
position:relative;
opacity:0;
animation:fadeIn 2s ease forwards;
}

/* FUNDO COM IMAGEM */
body::before{
content:"";
position:absolute;
top:0;
left:0;
width:100%;
height:100%;
background:
linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.8)),
url("fundo.jpeg") center center no-repeat;
background-size:cover;
z-index:0;
}

/* FADE */
@keyframes fadeIn{
to{opacity:1;}
}

/* ESTRELAS */
.estrelas{
position:fixed;
width:100%;
height:100%;
z-index:1;
}

.estrela{
position:absolute;
width:2px;
height:2px;
border-radius:50%;
animation:piscar 2s infinite alternate;
}

@keyframes piscar{
from{opacity:0.2;}
to{opacity:1;}
}

/* CONTAINER */
.container{
text-align:center;
position:relative;
z-index:50;
}

/* NOME */
.nome-container{
display:flex;
align-items:center;
justify-content:center;
gap:15px;
margin-bottom:40px;
}

.nome{
font-family:'Great Vibes', cursive;
font-size:4.2rem;
line-height:1.2;
padding:5px 10px;
background: linear-gradient(90deg, #66c2ff, #66ff99, #ff9933);
-webkit-background-clip: text;
-webkit-text-fill-color: transparent;
text-shadow: 0 0 20px rgba(255,255,255,0.3);
}

.girassol{
font-size:2.2rem;
filter: drop-shadow(0 0 10px rgba(255, 200, 0, 0.7));
animation: girassolPulse 2s infinite alternate;
}

@keyframes girassolPulse{
from{transform:scale(1);}
to{transform:scale(1.12);}
}

/* CONTADOR */
.contador{
background:#0a0a0a;
padding:25px;
border-radius:15px;
border:1px solid rgba(182, 245, 201, 0.3);
z-index:100;
position:relative;
box-shadow:0 0 30px rgba(0,0,0,0.9);
}

.tempo{
margin-top:10px;
font-size:1.3rem;
}

/* FLOAT */
.float{
position:fixed;
bottom:-20px;
font-size:22px;
animation:subir linear forwards;
z-index:2;
pointer-events:none;
}

@keyframes subir{
0%{transform:translateY(0);opacity:0;}
10%{opacity:1;}
100%{transform:translateY(-120vh);opacity:0;}
}

/* FRASES */
.frase{
position:fixed;
font-family:'Great Vibes', cursive;
font-size:1.5rem;
opacity:0;
animation:fadeMove 15s ease-in-out forwards;
max-width:260px;
text-align:center;
z-index:3;
}

@keyframes fadeMove{
0%{opacity:0; transform:translateX(-20px);}
20%{opacity:1;}
80%{opacity:1;}
100%{opacity:0; transform:translateX(20px);}
}

/* PLAYER */
.player{
position:fixed;
top:20px;
right:20px;
z-index:200;
}

.player select{
background:#111;
color:white;
border:1px solid rgba(255,255,255,0.2);
padding:5px;
border-radius:5px;
}

</style>
</head>

<body>

<div class="estrelas" id="estrelas"></div>

<div class="player">
<select id="musicSelector"></select>
</div>

<div class="container">

<div class="nome-container">
<span class="girassol">🌻</span>
<div class="nome">Luan & Girlane</div>
<span class="girassol">🌻</span>
</div>

<div class="contador">
Estamos juntos há:
<div class="tempo" id="tempo"></div>
</div>

</div>

<audio id="musica" loop></audio>

<script>

/* ESTRELAS */
const cores=["#66c2ff","#66ff99","#ffd966","#ffffff"];

for(let i=0;i<80;i++){
const estrela=document.createElement("div");
estrela.className="estrela";

estrela.style.top=Math.random()*100+"%";
estrela.style.left=Math.random()*100+"%";
estrela.style.background=cores[Math.floor(Math.random()*cores.length)];
estrela.style.animationDuration=(1+Math.random()*2)+"s";

document.getElementById("estrelas").appendChild(estrela);
}

/* CONTADOR */
const dataInicio=new Date("2026-03-02");

function atualizarTempo(){
const agora=new Date();
const diff=Math.floor((agora-dataInicio)/1000);

const anos=Math.floor(diff/(365.25*24*3600));
const meses=Math.floor((diff%(365.25*24*3600))/(30.44*24*3600));
const dias=Math.floor((diff%(30.44*24*3600))/(24*3600));
const horas=Math.floor((diff%(24*3600))/3600);
const minutos=Math.floor((diff%3600)/60);
const segundos=diff%60;

document.getElementById("tempo").innerHTML=
`${anos} anos, ${meses} meses, ${dias} dias<br>
${horas}h ${minutos}m ${segundos}s`;
}

setInterval(atualizarTempo,1000);
atualizarTempo();

/* FLOAT */
const simbolos=["❤️","🌻"];

function criarFloat(){
const el=document.createElement("div");
el.className="float";
el.innerHTML=simbolos[Math.floor(Math.random()*simbolos.length)];

el.style.left=Math.random()*100+"vw";
el.style.animationDuration=(10+Math.random()*5)+"s";

document.body.appendChild(el);

setTimeout(()=>el.remove(),15000);
}

setInterval(criarFloat,1200);

/* FRASES */
const frases=[
"Entre todos os girassóis do mundo, nenhum brilha mais do que o teu sorriso 🌻",
"Você não é só parte dos meus dias… você é o melhor deles ❤️",
"O mundo pode ser grande… mas nada nele me faz sentir tão completo quanto você 💫"
];

const posicoes=[
{top:"5%",left:"5%"},
{top:"5%",right:"5%"},
{top:"30%",left:"5%"},
{top:"30%",right:"5%"},
{bottom:"10%",left:"5%"},
{bottom:"10%",right:"5%"}
];

let indexPos=0;

function criarFrase(){
const frase=document.createElement("div");
frase.className="frase";

frase.innerText=frases[Math.floor(Math.random()*frases.length)];

const pos=posicoes[indexPos];
indexPos=(indexPos+1)%posicoes.length;

for(let key in pos){
frase.style[key]=pos[key];
}

document.body.appendChild(frase);

setTimeout(()=>frase.remove(),15000);
}

setInterval(criarFrase,6000);

/* MÚSICA */
const player=document.getElementById("musica");
player.src="standbyme.mp3";
player.volume=0.3;
player.play().catch(()=>{});

</script>

</body>
</html>
