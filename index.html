<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Luan & Girlane ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Great+Vibes&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
font-family:'Playfair Display', serif;
color:white;
overflow:hidden;
position:relative;
opacity:0;
animation:fadeIn 2s ease forwards;
}

@keyframes fadeIn{
to{opacity:1;}
}

/* FUNDO */
body::before{
content:"";
position:absolute;
top:0;
left:0;
width:100%;
height:100%;
background:
linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.7)),
url("fundo.jpeg") center center no-repeat;
background-size:cover;
z-index:0;
}

/* CONTAINER */
.container{
text-align:center;
position:relative;
z-index:50;
}

/* NOME */
.nome-container{
display:flex;
align-items:center;
justify-content:center;
gap:15px;
margin-bottom:40px;
}

.nome{
font-family:'Great Vibes', cursive;
font-size:4.2rem;
line-height:1.2;
padding:5px 10px;
background: linear-gradient(90deg, #66c2ff, #66ff99, #ff9933);
-webkit-background-clip: text;
-webkit-text-fill-color: transparent;
text-shadow: 0 0 20px rgba(255,255,255,0.3);
}

.girassol{
font-size:2.2rem;
filter: drop-shadow(0 0 10px rgba(255, 200, 0, 0.7));
animation: girassolPulse 2s infinite alternate;
}

@keyframes girassolPulse{
from{transform:scale(1);}
to{transform:scale(1.12);}
}

/* 🔥 CONTADOR AJUSTADO */
.contador{
background: rgba(10,10,10,0.18); /* MUITO MAIS TRANSPARENTE */
backdrop-filter: blur(2px); /* QUASE SEM BORRÃO */
-webkit-backdrop-filter: blur(2px);

padding:25px;
border-radius:15px;
border:1px solid rgba(255,255,255,0.25);
z-index:100;
position:relative;

box-shadow:0 0 15px rgba(0,0,0,0.3);
}

.tempo{
margin-top:10px;
font-size:1.3rem;
}

/* FLOAT */
.float{
position:fixed;
bottom:-20px;
font-size:22px;
animation:subir linear forwards;
z-index:2;
pointer-events:none;
}

@keyframes subir{
0%{transform:translateY(0);opacity:0;}
10%{opacity:1;}
100%{transform:translateY(-120vh);opacity:0;}
}

/* FRASES */
.frase{
position:fixed;
font-family:'Great Vibes', cursive;
font-size:1.5rem;
opacity:0;
animation:fadeMove 15s ease-in-out forwards;
max-width:260px;
text-align:center;
z-index:3;
}

@keyframes fadeMove{
0%{opacity:0; transform:translateX(-20px);}
20%{opacity:1;}
80%{opacity:1;}
100%{opacity:0; transform:translateX(20px);}
}

</style>
</head>

<body>

<div class="container">

<div class="nome-container">
<span class="girassol">🌻</span>
<div class="nome">Luan & Girlane</div>
<span class="girassol">🌻</span>
</div>

<div class="contador">
Estamos juntos há:
<div class="tempo" id="tempo"></div>
</div>

</div>

<script>

/* CONTADOR */
const dataInicio=new Date("2026-03-02");

function atualizarTempo(){
const agora=new Date();
const diff=Math.floor((agora-dataInicio)/1000);

const dias=Math.floor(diff/(24*3600));
const horas=Math.floor((diff%(24*3600))/3600);
const minutos=Math.floor((diff%3600)/60);
const segundos=diff%60;

document.getElementById("tempo").innerHTML=
`${dias} dias ${horas}h ${minutos}m ${segundos}s`;
}

setInterval(atualizarTempo,1000);
atualizarTempo();

</script>

</body>
</html>
