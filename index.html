<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Luan & Girlane ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Great+Vibes&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
font-family:'Playfair Display', serif;
color:white;
overflow:hidden;
position:relative;
opacity:0;
animation:fadeIn 2s ease forwards;
}

@keyframes fadeIn{to{opacity:1;}}

body::before{
content:"";
position:absolute;
width:100%;
height:100%;
background:
linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.7)),
url("fundo.jpeg") center center no-repeat;
background-size:cover;
z-index:0;
}

/* PLAYER */
.player{
position:fixed;
top:20px;
right:20px;
z-index:200;
width:260px;
background:rgba(15,15,15,0.9);
border-radius:20px;
padding:15px;
box-shadow:0 15px 40px rgba(0,0,0,0.8);
text-align:center;
backdrop-filter: blur(8px);
}

.foto-musica{
position:relative;
display:flex;
justify-content:center;
margin-bottom:10px;
}

.foto-musica img{
width:180px;
height:180px;
object-fit:cover;
border-radius:50%;
box-shadow:0 0 20px rgba(255,200,0,0.4);
}

.controls{
position:absolute;
bottom:20px;
left:50%;
transform:translateX(-50%);
display:flex;
gap:12px;
}

.controls button{
background:white;
border:none;
border-radius:50%;
width:45px;
height:45px;
cursor:pointer;
font-size:18px;
box-shadow:0 5px 15px rgba(0,0,0,0.5);
}

.controls .play{
width:60px;
height:60px;
font-size:22px;
}

.titulo{font-size:16px;font-weight:bold;margin-top:10px;}
.artista{font-size:13px;opacity:0.7;}

/* ESTRELAS */
.estrelas{position:fixed;width:100%;height:100%;z-index:1;}
.estrela{
position:absolute;
width:2px;
height:2px;
border-radius:50%;
background:white;
animation:piscar infinite alternate;
}
@keyframes piscar{
0%{opacity:0.2;}
100%{opacity:1;}
}

/* FLOAT */
.float{
position:fixed;
bottom:-50px;
font-size:28px;
animation:subir linear forwards;
z-index:2;
pointer-events:none;
opacity:0.9;
}
@keyframes subir{
0%{transform:translateY(0) scale(0.8);opacity:0;}
10%{opacity:1;}
50%{transform:translateY(-50vh) scale(1.1);}
100%{transform:translateY(-120vh) scale(0.9);opacity:0;}
}

/* FOTO FLOAT */
.foto-float{
position:fixed;
bottom:-200px;
width:180px;
background:white;
padding:8px;
border-radius:10px;
box-shadow:0 25px 50px rgba(0,0,0,0.9);
z-index:5;
animation:subirFoto linear forwards;
}

.foto-float img{width:100%;border-radius:6px;}

@keyframes subirFoto{
0%{transform:translateY(0) scale(0.9);opacity:0;}
10%{opacity:1;}
100%{transform:translateY(-150vh) scale(1);opacity:0;}
}

/* TEXTO */
.container{text-align:center;z-index:50;position:relative;}
.nome-container{display:flex;align-items:center;justify-content:center;gap:26px;margin-bottom:45px;}

.nome{
font-family:'Great Vibes', cursive;
font-size:5rem;
letter-spacing:2px;
background: linear-gradient(90deg,#66c2ff,#66ff99,#ff9933);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

.girassol{
font-size:3rem;
animation:pulse 2s infinite alternate;
}
@keyframes pulse{from{transform:scale(1);}to{transform:scale(1.2);}}

.contador{
background: rgba(10,10,10,0.15);
backdrop-filter: blur(2px);
padding:25px;border-radius:15px;
border:1px solid rgba(255,255,255,0.25);
}

.tempo{font-size:1.4rem;margin-top:10px;line-height:1.6;}
</style>
</head>

<body>

<div class="player">
<div class="foto-musica">
<img src="fotomusica1.png" onerror="this.style.display='none'">

<div class="controls">
<button onclick="trocarMusica(-1)">⏮</button>
<button class="play" onclick="playPause()">▶</button>
<button onclick="trocarMusica(1)">⏭</button>
</div>
</div>

<div class="titulo">Lu e Gi</div>
<div class="artista">Juntos para sempre</div>
</div>

<div class="estrelas" id="estrelas"></div>

<div class="container">
<div class="nome-container">
<span class="girassol">🌻</span>
<div class="nome">Luan ❤️ Girlane</div>
<span class="girassol">🌻</span>
</div>

<div class="contador">
Estamos juntos há:
<div class="tempo" id="tempo"></div>
</div>
</div>

<audio id="musica"></audio>

<script>

/* ESTRELAS */
function gerarEstrelas(){
const container=document.getElementById("estrelas");
for(let i=0;i<80;i++){
const e=document.createElement("div");
e.className="estrela";
e.style.top=Math.random()*100+"%";
e.style.left=Math.random()*100+"%";
e.style.animationDuration=(1.5 + Math.random()*2)+"s";
container.appendChild(e);
}}
gerarEstrelas();

/* FLOAT */
const simbolos=["❤️","🌻"];
setInterval(()=>{
const el=document.createElement("div");
el.className="float";
el.innerHTML=simbolos[Math.floor(Math.random()*2)];
el.style.left=Math.random()*100+"vw";
el.style.animationDuration=(8 + Math.random()*6)+"s";
document.body.appendChild(el);
setTimeout(()=>el.remove(),15000);
},800);

/* FOTOS (AGORA CORRETO .jpeg) */
const fotos=["foto1.jpeg","foto2.jpeg","foto3.jpeg"];

setInterval(()=>{
const f=document.createElement("div");
f.className="foto-float";
f.style.left=(10 + Math.random()*70)+"vw";
f.style.animationDuration=(10 + Math.random()*6)+"s";

const img=document.createElement("img");
img.src=fotos[Math.floor(Math.random()*fotos.length)];

img.onerror=()=>f.remove();

f.appendChild(img);
document.body.appendChild(f);

setTimeout(()=>f.remove(),18000);
},4000);

/* CRONÔMETRO COMPLETO */
const dataInicio=new Date("2026-03-02T00:00:00");

function atualizarTempo(){
const agora=new Date();

let anos=agora.getFullYear()-dataInicio.getFullYear();
let meses=agora.getMonth()-dataInicio.getMonth();
let dias=agora.getDate()-dataInicio.getDate();
let horas=agora.getHours()-dataInicio.getHours();
let minutos=agora.getMinutes()-dataInicio.getMinutes();
let segundos=agora.getSeconds()-dataInicio.getSeconds();

if(segundos<0){segundos+=60;minutos--;}
if(minutos<0){minutos+=60;horas--;}
if(horas<0){horas+=24;dias--;}
if(dias<0){
const ultimoMes=new Date(agora.getFullYear(),agora.getMonth(),0).getDate();
dias+=ultimoMes;
meses--;
}
if(meses<0){meses+=12;anos--;}

document.getElementById("tempo").innerHTML=
`${anos} anos, ${meses} meses, ${dias} dias<br>
${horas}h ${minutos}m ${segundos}s ❤️`;
}

setInterval(atualizarTempo,1000);
atualizarTempo();

/* MÚSICA */
const playlist=["musica1.mp3","musica2.mp3"];
let musicaIndex=0;
let tocando=false;
const musica=document.getElementById("musica");

function playPause(){
if(!musica.src) musica.src=playlist[0];
tocando?musica.pause():musica.play().catch(()=>{});
tocando=!tocando;
}

function trocarMusica(dir){
musicaIndex=(musicaIndex+dir+playlist.length)%playlist.length;
musica.src=playlist[musicaIndex];
musica.play().catch(()=>{});
tocando=true;
}

musica.src=playlist[0];
musica.volume=0.3;

</script>

</body>
</html>
