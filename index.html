<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Luan & Girlane ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Great+Vibes&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
font-family:'Playfair Display', serif;
color:white;
overflow:hidden;
position:relative;
opacity:0;
animation:fadeIn 2s ease forwards;
}

@keyframes fadeIn{to{opacity:1;}}

body::before{
content:"";
position:absolute;
width:100%;
height:100%;
background:
linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.7)),
url("fundo.jpeg") center center no-repeat;
background-size:cover;
z-index:0;
}

/* PLAYER NOVO */
.player{
position:fixed;
top:20px;
right:20px;
z-index:200;
width:280px;
background:#111;
border-radius:20px;
padding:15px;
box-shadow:0 10px 40px rgba(0,0,0,0.9);
}

.player-img{
width:100%;
height:140px;
background:#333;
border-radius:12px;
margin-bottom:10px;
}

.player-info{
font-size:14px;
margin-bottom:10px;
}

.player-controls{
display:flex;
justify-content:center;
align-items:center;
gap:15px;
margin:10px 0;
}

.player-controls button{
background:white;
border:none;
border-radius:50%;
width:40px;
height:40px;
cursor:pointer;
}

.play{
width:55px;
height:55px;
font-size:18px;
}

.player-extra{
display:flex;
justify-content:space-between;
font-size:12px;
opacity:0.7;
}

/* ESTRELAS */
.estrelas{position:fixed;width:100%;height:100%;z-index:1;}

.estrela{
position:absolute;
width:3px;
height:3px;
border-radius:50%;
background:gold;
box-shadow:0 0 10px gold,0 0 20px gold;
animation:estrelaAnim linear forwards;
}

@keyframes estrelaAnim{
0%{opacity:0;transform:scale(0.5);}
30%{opacity:1;transform:scale(1.2);}
70%{opacity:1;}
100%{opacity:0;transform:scale(0.5);}
}

/* FRASES */
.frase-float{
position:fixed;
font-family:'Great Vibes', cursive;
font-size:2rem;
color:white;
opacity:0;
animation:fadeFrase 10s forwards;
z-index:100;
pointer-events:none;
text-shadow:0 0 10px rgba(255,255,255,0.8);
}

@keyframes fadeFrase{
0%{opacity:0;}
10%{opacity:1;}
80%{opacity:1;}
100%{opacity:0;}
}

/* RESTANTE */
.container{text-align:center;z-index:50;position:relative;}

.nome{
font-family:'Great Vibes', cursive;
font-size:5rem;
background: linear-gradient(90deg,#66c2ff,#66ff99,#ff9933);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

.contador{
background: rgba(10,10,10,0.15);
padding:25px;border-radius:15px;
border:1px solid rgba(255,255,255,0.25);
}

.tempo{font-size:1.3rem;margin-top:10px;}
</style>
</head>

<body>

<!-- PLAYER -->
<div class="player">
<div class="player-img"></div>

<div class="player-info">
<strong>Lu e Gi</strong><br>
Juntos para sempre
</div>

<div class="player-controls">
<button onclick="trocarMusica(-1)">⏮</button>
<button class="play" onclick="playPause()">▶</button>
<button onclick="trocarMusica(1)">⏭</button>
</div>

<div class="player-extra">
<span>❤️ 🔁</span>
<span>▂▃▅▇▅▃▂</span>
</div>
</div>

<div class="estrelas" id="estrelas"></div>

<div class="container">
<div class="nome">Luan ❤️ Girlane</div>

<div class="contador">
Estamos juntos há:
<div class="tempo" id="tempo"></div>
</div>
</div>

<audio id="musica"></audio>

<script>

/* FRASES RANDOM */
const frases=[
"Você é o meu lugar favorito ❤️",
"Te amar é minha melhor escolha 🌻",
"Nosso amor é único 💫",
"Com você tudo faz sentido 💛",
"Meu mundo é você ✨"
];

setInterval(()=>{
const f=document.createElement("div");
f.className="frase-float";
f.innerHTML=frases[Math.floor(Math.random()*frases.length)];

f.style.top=Math.random()*80+"vh";
f.style.left=Math.random()*80+"vw";

document.body.appendChild(f);
setTimeout(()=>f.remove(),10000);

},3000);

/* ESTRELAS DINÂMICAS */
setInterval(()=>{
const e=document.createElement("div");
e.className="estrela";
e.style.top=Math.random()*100+"%";
e.style.left=Math.random()*100+"%";
e.style.animationDuration="10s";
document.getElementById("estrelas").appendChild(e);
setTimeout(()=>e.remove(),10000);
},200);

/* CRONÔMETRO */
const dataInicio=new Date("2026-03-02T00:00:00");

function atualizarTempo(){
const agora=new Date();

let anos=agora.getFullYear()-dataInicio.getFullYear();
let meses=agora.getMonth()-dataInicio.getMonth();
let dias=agora.getDate()-dataInicio.getDate();
let horas=agora.getHours()-dataInicio.getHours();
let minutos=agora.getMinutes()-dataInicio.getMinutes();
let segundos=agora.getSeconds()-dataInicio.getSeconds();

if(segundos<0){segundos+=60;minutos--;}
if(minutos<0){minutos+=60;horas--;}
if(horas<0){horas+=24;dias--;}
if(dias<0){
const ultimoMes=new Date(agora.getFullYear(),agora.getMonth(),0).getDate();
dias+=ultimoMes;
meses--;
}
if(meses<0){meses+=12;anos--;}

document.getElementById("tempo").innerHTML=
`${anos} anos, ${meses} meses, ${dias} dias<br>
${horas}h ${minutos}m ${segundos}s ❤️`;
}

setInterval(atualizarTempo,1000);
atualizarTempo();

/* MÚSICA */
const playlist=["musica1.mp3","musica2.mp3"];
let musicaIndex=0;
let tocando=false;
const musica=document.getElementById("musica");

function playPause(){
tocando?musica.pause():musica.play().catch(()=>{});
tocando=!tocando;
}

function trocarMusica(dir){
musicaIndex=(musicaIndex+dir+playlist.length)%playlist.length;
musica.src=playlist[musicaIndex];
musica.play().catch(()=>{});
tocando=true;
}

musica.src=playlist[0];
musica.volume=0.3;

</script>

</body>
</html>
