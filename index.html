<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Luan & Girlane ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Great+Vibes&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
font-family:'Playfair Display', serif;
color:white;
overflow:hidden;
position:relative;
opacity:0;
animation:fadeIn 2s ease forwards;
}

@keyframes fadeIn{to{opacity:1;}}

body::before{
content:"";
position:absolute;
width:100%;
height:100%;
background:
linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.7)),
url("fundo.jpeg") center center no-repeat;
background-size:cover;
z-index:0;
}

/* BOTÃO MÚSICA */
.player{
position:fixed;
top:20px;
right:20px;
z-index:200;
background:rgba(0,0,0,0.6);
padding:10px;
border-radius:10px;
backdrop-filter:blur(5px);
}

.player button{
margin:5px;
padding:6px 10px;
border:none;
border-radius:6px;
cursor:pointer;
}

/* resto igual */
.estrelas{position:fixed;width:100%;height:100%;z-index:1;}
.estrela{position:absolute;width:2px;height:2px;border-radius:50%;background:white;animation:piscar 2s infinite alternate;}

.container{text-align:center;z-index:50;position:relative;}

.nome-container{display:flex;align-items:center;justify-content:center;gap:26px;margin-bottom:45px;}

.nome{
font-family:'Great Vibes', cursive;
font-size:5rem;
letter-spacing:2px;
background: linear-gradient(90deg,#66c2ff,#66ff99,#ff9933);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

.coracao{margin:0 10px;}

.girassol{
font-size:3rem;
filter: drop-shadow(0 0 10px rgba(255,200,0,0.8));
animation:pulse 2s infinite alternate;
}

@keyframes pulse{from{transform:scale(1);}to{transform:scale(1.2);}}

/* contador */
.contador{
background: rgba(10,10,10,0.15);
backdrop-filter: blur(2px);
padding:25px;border-radius:15px;
border:1px solid rgba(255,255,255,0.25);
z-index:100;
}

.tempo{font-size:1.5rem;margin-top:10px;}

/* icones */
.float{position:fixed;bottom:-20px;font-size:32px;animation:subir linear forwards;z-index:2;}

@keyframes subir{
0%{transform:translateY(0);opacity:0;}
10%{opacity:1;}
100%{transform:translateY(-130vh);opacity:0;}
}

/* FOTO */
.foto-float{
position:fixed;
bottom:-200px;
width:190px;
background:white;
padding:8px;
border-radius:8px;
box-shadow:0 20px 40px rgba(0,0,0,0.7);
z-index:10;
animation:subirFoto linear forwards;
}

.foto-float img{width:100%;border-radius:6px;}

@keyframes subirFoto{
0%{transform:translateY(0);opacity:0;}
10%{opacity:1;}
100%{transform:translateY(-140vh);opacity:1;}
}

/* FRASES */
.frase{
position:fixed;
font-family:'Great Vibes', cursive;
font-size:1.9rem;
opacity:0;
animation:fadeMove 15s ease-in-out forwards;
z-index:3;
max-width:280px;
text-align:center;
}

.frase-pequena{
font-size:1.4rem;
max-width:320px;
}

@keyframes fadeMove{
0%{opacity:0;}
20%{opacity:1;}
80%{opacity:1;}
100%{opacity:0;}
}

</style>
</head>

<body>

<div class="player">
<button onclick="trocarMusica(0)">🎵 1</button>
<button onclick="trocarMusica(1)">🎵 2</button>
</div>

<div class="estrelas" id="estrelas"></div>

<div class="container">
<div class="nome-container">
<span class="girassol">🌻</span>
<div class="nome">Luan <span class="coracao">❤️</span> Girlane</div>
<span class="girassol">🌻</span>
</div>

<div class="contador">
Estamos juntos há:
<div class="tempo" id="tempo"></div>
</div>
</div>

<audio id="musica"></audio>

<script>

/* VARIÁVEIS FALTANTES (CORREÇÃO DO BUG) */
let fraseAtiva=false;
let indexFrase=0;

const posicoesFrases=[
{top:"5%", left:"5%"},
{top:"5%", right:"5%"},
{bottom:"10%", left:"5%"},
{bottom:"10%", right:"5%"}
];

/* ESTRELAS */
for(let i=0;i<80;i++){
const e=document.createElement("div");
e.className="estrela";
e.style.top=Math.random()*100+"%";
e.style.left=Math.random()*100+"%";
document.getElementById("estrelas").appendChild(e);
}

/* CONTADOR */
const dataInicio=new Date("2026-03-02");
function atualizarTempo(){
const agora=new Date();
let diff=agora-dataInicio;

const anos=Math.floor(diff/(365.25*24*3600*1000));
diff%=(365.25*24*3600*1000);

const meses=Math.floor(diff/(30.44*24*3600*1000));
diff%=(30.44*24*3600*1000);

const dias=Math.floor(diff/(24*3600*1000));
diff%=(24*3600*1000);

const horas=Math.floor(diff/(3600*1000));
diff%=(3600*1000);

const minutos=Math.floor(diff/(60*1000));
diff%=(60*1000);

const segundos=Math.floor(diff/1000);

document.getElementById("tempo").innerHTML=
`${anos} anos, ${meses} meses, ${dias} dias<br>
${horas}h ${minutos}m ${segundos}s`;
}
setInterval(atualizarTempo,1000);

/* FRASES (AGORA FUNCIONANDO) */
const frases=[
"Entre todos os girassóis do mundo, nenhum brilha mais do que o teu sorriso 🌻",
"Você não é só parte dos meus dias… você é o melhor deles ❤️",
"O mundo pode ser grande… mas nada nele me faz sentir tão completo quanto você 💫",
"Eu não sei exatamente em que momento você deixou de ser só alguém especial e virou alguém essencial pra mim… mas sei que, desde então, tudo ficou mais leve."
];

const fraseEspecial=`Eu não preciso de muito pra saber o que eu sinto...

Eu quero você comigo.`;

let contadorFrase=0;

function criarFrase(){

if(fraseAtiva) return;

fraseAtiva=true;

const f=document.createElement("div");

if(contadorFrase % 5 === 0){
f.className="frase frase-pequena";
f.innerText=fraseEspecial;
}else{
f.className="frase";
f.innerText=frases[Math.floor(Math.random()*frases.length)];
}

contadorFrase++;

const pos=posicoesFrases[indexFrase];
indexFrase=(indexFrase+1)%posicoesFrases.length;

for(let key in pos){
f.style[key]=pos[key];
}

document.body.appendChild(f);

setTimeout(()=>{
f.remove();
fraseAtiva=false;
},15000);
}

setInterval(criarFrase,7000);

/* 🎵 MÚSICAS */
const playlist=["musica1.mp3","musica2.mp3"];
let musicaIndex=0;

const musica=document.getElementById("musica");
musica.src=playlist[musicaIndex];
musica.volume=0.3;

function trocarMusica(i){
musicaIndex=i;
musica.src=playlist[musicaIndex];
musica.play();
}

musica.addEventListener("ended",()=>{
musicaIndex=(musicaIndex+1)%playlist.length;
musica.src=playlist[musicaIndex];
musica.play();
});

musica.play().catch(()=>{
document.body.addEventListener("click",()=>musica.play(),{once:true});
});

</script>

</body>
</html>
