<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Luan & Girlane ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Great+Vibes&display=swap" rel="stylesheet">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:#000;
color:white;
font-family:'Playfair Display', serif;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
overflow:hidden;
}

/* CONTAINER */
.container{
text-align:center;
position:relative;
}

/* FRASE TOPO */
.frase{
position:absolute;
top:-80px;
width:100%;
font-family:'Great Vibes', cursive;
font-size:1.5rem;
opacity:0.8;
}

/* IMAGEM CENTRAL */
.foto-central{
width:300px;
border-radius:20px;
opacity:0.5;
}

/* NOME */
.nome{
position:absolute;
top:120px;
width:100%;
font-family:'Great Vibes', cursive;
font-size:2.5rem;
}

/* CARD CONTADOR */
.contador{
margin-top:-60px;
background:rgba(255,255,255,0.08);
padding:20px;
border-radius:15px;
backdrop-filter:blur(10px);
}

.tempo{
margin-top:10px;
font-size:1.2rem;
}

/* POLAROIDS */
.polaroids{
position:absolute;
bottom:-100px;
display:flex;
gap:15px;
}

.polaroid{
background:white;
padding:5px;
border-radius:10px;
width:90px;
transform:rotate(-5deg);
}

.polaroid img{
width:100%;
border-radius:8px;
}

.polaroid:nth-child(2){
transform:rotate(5deg);
}

.polaroid:nth-child(3){
transform:rotate(-3deg);
}
</style>
</head>

<body>

<div class="container">

<div class="frase">
Se eu tivesse que escolher de novo, escolheria você.
</div>

<img src="https://via.placeholder.com/300x400" class="foto-central">

<div class="nome">
Luan & Girlane ❤️
</div>

<div class="contador">
Estamos juntos há:
<div class="tempo" id="tempo"></div>
</div>

<div class="polaroids">
<div class="polaroid"><img src="https://via.placeholder.com/100"></div>
<div class="polaroid"><img src="https://via.placeholder.com/100"></div>
<div class="polaroid"><img src="https://via.placeholder.com/100"></div>
</div>

</div>

<script>

const dataInicio = new Date("2026-03-02");

function atualizarTempo(){
const agora = new Date();
const diff = Math.floor((agora - dataInicio)/1000);

const anos = Math.floor(diff/(365.25*24*3600));
const meses = Math.floor((diff%(365.25*24*3600))/(30.44*24*3600));
const dias = Math.floor((diff%(30.44*24*3600))/(24*3600));
const horas = Math.floor((diff%(24*3600))/3600);
const minutos = Math.floor((diff%3600)/60);
const segundos = diff%60;

document.getElementById("tempo").innerHTML =
`${anos} anos, ${meses} meses, ${dias} dias<br>
${horas}h ${minutos}m ${segundos}s`;
}

setInterval(atualizarTempo,1000);
atualizarTempo();

</script>

</body>
</html>
