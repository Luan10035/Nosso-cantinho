<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Luan & Girlane ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Great+Vibes&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;}

html, body{
width:100%;
height:100%;
font-family:'Playfair Display', serif;
overflow:hidden;
color:white;
}

/* FUNDO 100% */
body{
position:relative;
background:
linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.7)),
url("fundo.jpeg") no-repeat center center;
background-size:cover;
}

/* CONTAINER CENTRAL */
.container{
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
text-align:center;
z-index:50;
width:90%;
max-width:900px;
}

/* NOMES */
.nome{
font-family:'Great Vibes', cursive;
font-size:5rem;
background: linear-gradient(90deg,#66c2ff,#66ff99,#ff9933);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

@media(max-width:768px){
.nome{font-size:3rem;}
}

/* FRASES */
.frase{
margin:20px 0;
font-size:1.4rem;
opacity:0;
transition:opacity 1s;
min-height:40px;
}

@media(max-width:768px){
.frase{font-size:1.1rem;}
}

/* CONTADOR */
.contador{
background: rgba(0,0,0,0.25);
padding:20px;
border-radius:15px;
}

.tempo{font-size:1.2rem;margin-top:10px;line-height:1.5;}

/* PLAYER */
.player{
position:fixed;
top:15px;
right:15px;
z-index:200;
width:220px;
background:rgba(15,15,15,0.9);
border-radius:20px;
padding:10px;
text-align:center;
backdrop-filter: blur(8px);
}

.foto-musica img{
width:120px;
height:120px;
border-radius:50%;
object-fit:cover;
}

/* MOBILE PLAYER */
@media(max-width:768px){
.player{
width:160px;
padding:8px;
}
.foto-musica img{
width:90px;
height:90px;
}
}

/* CONTROLES */
.controls{
margin-top:8px;
display:flex;
justify-content:center;
gap:8px;
}

.controls button{
background:white;
border:none;
border-radius:50%;
width:35px;
height:35px;
cursor:pointer;
}

.controls .play{
width:45px;
height:45px;
}

/* ESTRELAS */
.estrelas{position:fixed;width:100%;height:100%;z-index:1;}
.estrela{
position:absolute;
width:2px;height:2px;background:white;
animation:piscar infinite alternate;
}
@keyframes piscar{
0%{opacity:0.2;}
100%{opacity:1;}
}

/* FLOAT */
.float{
position:fixed;
bottom:-50px;
font-size:22px;
animation:subir linear forwards;
z-index:2;
}
@keyframes subir{
0%{transform:translateY(0);opacity:0;}
10%{opacity:1;}
100%{transform:translateY(-120vh);opacity:0;}
}

/* FOTOS */
.foto-float{
position:fixed;
bottom:-200px;
width:140px;
background:white;
padding:6px;
border-radius:10px;
z-index:5;
animation:subirFoto linear forwards;
}

.foto-float img{width:100%;border-radius:6px;}

@media(max-width:768px){
.foto-float{width:100px;}
}

@keyframes subirFoto{
0%{transform:translateY(0);opacity:0;}
10%{opacity:1;}
100%{transform:translateY(-150vh);opacity:0;}
}
</style>
</head>

<body>

<!-- PLAYER -->
<div class="player">
<div class="foto-musica">
<img src="fotomusica1.png">
</div>

<div class="controls">
<button onclick="trocarMusica(-1)">⏮</button>
<button class="play" onclick="playPause()">▶</button>
<button onclick="trocarMusica(1)">⏭</button>
</div>
</div>

<div class="estrelas" id="estrelas"></div>

<div class="container">
<div class="nome">Luan ❤️ Girlane</div>
<div class="frase" id="frase"></div>

<div class="contador">
Estamos juntos há:
<div class="tempo" id="tempo"></div>
</div>
</div>

<audio id="musica"></audio>

<script>

/* FRASES */
const frases=[
"Eu escolheria você mil vezes 💛",
"Você é o meu lar ✨",
"Cada momento contigo é único ❤️",
"Nosso amor é leve e verdadeiro 🌻"
];

let fIndex=0;
const fraseEl=document.getElementById("frase");

function trocarFrase(){
fraseEl.style.opacity=0;
setTimeout(()=>{
fraseEl.innerHTML=frases[fIndex];
fraseEl.style.opacity=1;
fIndex=(fIndex+1)%frases.length;
},500);
}
setInterval(trocarFrase,4000);
trocarFrase();

/* ESTRELAS */
const estrelas=document.getElementById("estrelas");
for(let i=0;i<80;i++){
let e=document.createElement("div");
e.className="estrela";
e.style.top=Math.random()*100+"%";
e.style.left=Math.random()*100+"%";
e.style.animationDuration=(1+Math.random()*2)+"s";
estrelas.appendChild(e);
}

/* FLOAT */
setInterval(()=>{
let el=document.createElement("div");
el.className="float";
el.innerHTML=Math.random()>0.5?"❤️":"🌻";
el.style.left=Math.random()*100+"vw";
el.style.animationDuration=(8+Math.random()*5)+"s";
document.body.appendChild(el);
setTimeout(()=>el.remove(),15000);
},800);

/* FOTOS */
const fotos=["foto1.jpeg","foto2.jpeg","foto3.jpeg"];

setInterval(()=>{
let f=document.createElement("div");
f.className="foto-float";
f.style.left=(10+Math.random()*70)+"vw";
f.style.animationDuration=(10+Math.random()*5)+"s";

let img=document.createElement("img");
img.src=fotos[Math.floor(Math.random()*fotos.length)];
img.onerror=()=>f.remove();

f.appendChild(img);
document.body.appendChild(f);

setTimeout(()=>f.remove(),18000);
},4000);

/* CRONÔMETRO COMPLETO */
const inicio=new Date("2026-03-02T00:00:00");

function atualizar(){
const agora=new Date();

let anos=agora.getFullYear()-inicio.getFullYear();
let meses=agora.getMonth()-inicio.getMonth();
let dias=agora.getDate()-inicio.getDate();
let horas=agora.getHours()-inicio.getHours();
let minutos=agora.getMinutes()-inicio.getMinutes();
let segundos=agora.getSeconds()-inicio.getSeconds();

if(segundos<0){segundos+=60;minutos--;}
if(minutos<0){minutos+=60;horas--;}
if(horas<0){horas+=24;dias--;}
if(dias<0){
const ultimoMes=new Date(agora.getFullYear(),agora.getMonth(),0).getDate();
dias+=ultimoMes;
meses--;
}
if(meses<0){meses+=12;anos--;}

document.getElementById("tempo").innerHTML=
`${anos} anos, ${meses} meses, ${dias} dias<br>
${horas}h ${minutos}m ${segundos}s ❤️`;
}

setInterval(atualizar,1000);
atualizar();

/* MÚSICA */
const playlist=["musica1.mp3","musica2.mp3"];
let index=0;
const musica=document.getElementById("musica");

function tocar(){
musica.src=playlist[index];
musica.play().catch(()=>{});
}

function playPause(){
musica.paused?musica.play():musica.pause();
}

function trocarMusica(dir){
index=(index+dir+playlist.length)%playlist.length;
tocar();
}

/* AUTO NEXT */
musica.addEventListener("ended",()=>{
index=(index+1)%playlist.length;
tocar();
});

/* AUTO PLAY */
window.addEventListener("load",()=>{
tocar();
});

/* FALLBACK MOBILE */
document.body.addEventListener("click",()=>{
if(musica.paused){
musica.play().catch(()=>{});
}
},{once:true});

musica.volume=0.3;

</script>

</body>
</html>
