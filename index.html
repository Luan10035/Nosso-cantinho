<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Luan & Girlane ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Great+Vibes&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
font-family:'Playfair Display', serif;
color:white;
overflow:hidden;
position:relative;
opacity:0;
animation:fadeIn 2s ease forwards;
}

@keyframes fadeIn{to{opacity:1;}}

body::before{
content:"";
position:absolute;
width:100%;
height:100%;
background:
linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.7)),
url("fundo.jpeg") center center no-repeat;
background-size:cover;
z-index:0;
}

/* 🎵 PLAYER ESTILO SPOTIFY */
.player{
position:fixed;
top:20px;
right:20px;
z-index:200;
width:220px;
background:#111;
border-radius:18px;
padding:12px;
box-shadow:0 10px 30px rgba(0,0,0,0.6);
}

.player img{
width:100%;
border-radius:12px;
margin-bottom:10px;
}

.player .titulo{
font-size:14px;
font-weight:bold;
}

.player .artista{
font-size:12px;
opacity:0.7;
margin-bottom:10px;
}

.player .controls{
display:flex;
justify-content:center;
align-items:center;
gap:10px;
}

.player button{
background:white;
border:none;
border-radius:50%;
width:40px;
height:40px;
cursor:pointer;
font-size:16px;
}

/* RESTO DO SITE (INTACTO) */
.estrelas{position:fixed;width:100%;height:100%;z-index:1;}
.estrela{position:absolute;width:2px;height:2px;border-radius:50%;background:white;animation:piscar 2s infinite alternate;}

.container{text-align:center;z-index:50;position:relative;}

.nome-container{display:flex;align-items:center;justify-content:center;gap:26px;margin-bottom:45px;}

.nome{
font-family:'Great Vibes', cursive;
font-size:5rem;
letter-spacing:2px;
background: linear-gradient(90deg,#66c2ff,#66ff99,#ff9933);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

.coracao{margin:0 10px;}

.girassol{
font-size:3rem;
filter: drop-shadow(0 0 10px rgba(255,200,0,0.8));
animation:pulse 2s infinite alternate;
}

@keyframes pulse{from{transform:scale(1);}to{transform:scale(1.2);}}

/* contador */
.contador{
background: rgba(10,10,10,0.15);
backdrop-filter: blur(2px);
padding:25px;border-radius:15px;
border:1px solid rgba(255,255,255,0.25);
z-index:100;
}

.tempo{font-size:1.5rem;margin-top:10px;}

.float{position:fixed;bottom:-20px;font-size:32px;animation:subir linear forwards;z-index:2;}

@keyframes subir{
0%{transform:translateY(0);opacity:0;}
10%{opacity:1;}
100%{transform:translateY(-130vh);opacity:0;}
}

/* FOTO */
.foto-float{
position:fixed;
bottom:-200px;
width:190px;
background:white;
padding:8px;
border-radius:8px;
box-shadow:0 20px 40px rgba(0,0,0,0.7);
z-index:10;
animation:subirFoto linear forwards;
}

.foto-float img{width:100%;border-radius:6px;}

@keyframes subirFoto{
0%{transform:translateY(0);opacity:0;}
10%{opacity:1;}
100%{transform:translateY(-140vh);opacity:1;}
}

/* FRASES */
.frase{
position:fixed;
font-family:'Great Vibes', cursive;
font-size:1.9rem;
opacity:0;
animation:fadeMove 15s ease-in-out forwards;
z-index:3;
max-width:280px;
text-align:center;
}

.frase-pequena{
font-size:1.4rem;
max-width:320px;
}

@keyframes fadeMove{
0%{opacity:0;}
20%{opacity:1;}
80%{opacity:1;}
100%{opacity:0;}
}

</style>
</head>

<body>

<!-- PLAYER NOVO -->
<div class="player">
<img src="capa.jpg">
<div class="titulo">Luan e Gi</div>
<div class="artista">Nossa música ❤️</div>

<div class="controls">
<button onclick="trocarMusica(-1)">⏮</button>
<button onclick="playPause()">▶</button>
<button onclick="trocarMusica(1)">⏭</button>
</div>
</div>

<div class="estrelas" id="estrelas"></div>

<div class="container">
<div class="nome-container">
<span class="girassol">🌻</span>
<div class="nome">Luan <span class="coracao">❤️</span> Girlane</div>
<span class="girassol">🌻</span>
</div>

<div class="contador">
Estamos juntos há:
<div class="tempo" id="tempo"></div>
</div>
</div>

<audio id="musica"></audio>

<script>

/* PLAYER */
const playlist=["musica1.mp3","musica2.mp3"];
let musicaIndex=0;
let tocando=false;

const musica=document.getElementById("musica");

function playPause(){
if(tocando){
musica.pause();
tocando=false;
}else{
musica.play();
tocando=true;
}
}

function trocarMusica(dir){
musicaIndex=(musicaIndex+dir+playlist.length)%playlist.length;
musica.src=playlist[musicaIndex];
musica.play();
tocando=true;
}

musica.src=playlist[0];
musica.volume=0.3;

musica.play().then(()=>tocando=true).catch(()=>{
document.body.addEventListener("click",()=>{
musica.play();
tocando=true;
},{once:true});
});

</script>

</body>
</html>
