<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Luan & Girlane ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Great+Vibes&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
background:#000;
color:white;
font-family:'Playfair Display', serif;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
overflow:hidden;
opacity:0;
animation:fadeIn 2s ease forwards;
}

/* FADE GERAL */
@keyframes fadeIn{
to{opacity:1;}
}

/* ESTRELAS */
.estrelas{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
z-index:0;
overflow:hidden;
}

.estrela{
position:absolute;
width:2px;
height:2px;
background:white;
border-radius:50%;
opacity:0.8;
animation:piscar 2s infinite alternate;
}

@keyframes piscar{
from{opacity:0.2;}
to{opacity:1;}
}

/* CONTAINER */
.container{
text-align:center;
z-index:10;
position:relative;
}

/* NOME */
.nome{
font-family:'Great Vibes', cursive;
font-size:4rem;
margin-bottom:30px;
}

/* CONTADOR */
.contador{
background:#111;
padding:25px;
border-radius:15px;
border:1px solid rgba(255,255,255,0.2);
}

.tempo{
margin-top:10px;
font-size:1.3rem;
}

/* CORAÇÕES */
.heart{
position:fixed;
bottom:-20px;
font-size:22px;
animation:subir linear forwards;
z-index:1;
pointer-events:none;
}

@keyframes subir{
0%{transform:translateY(0);opacity:0;}
10%{opacity:1;}
100%{transform:translateY(-120vh);opacity:0;}
}

/* FRASES */
.frase{
position:fixed;
font-family:'Great Vibes', cursive;
font-size:1.5rem;
opacity:0;
animation:fadeMove 15s ease-in-out forwards;
max-width:260px;
text-align:center;
pointer-events:none;
z-index:2;
}

@keyframes fadeMove{
0%{opacity:0; transform:translateX(-20px);}
20%{opacity:1; transform:translateX(0);}
80%{opacity:1;}
100%{opacity:0; transform:translateX(20px);}
}

/* PLAYER */
.player{
position:fixed;
top:20px;
right:20px;
z-index:20;
}

.player select{
background:#111;
color:white;
border:1px solid rgba(255,255,255,0.2);
padding:5px;
border-radius:5px;
}

</style>
</head>

<body>

<div class="estrelas" id="estrelas"></div>

<div class="player">
<select id="musicSelector"></select>
</div>

<div class="container">

<div class="nome">
Luan & Girlane ❤️
</div>

<div class="contador">
Estamos juntos há:
<div class="tempo" id="tempo"></div>
</div>

</div>

<audio id="musica" loop></audio>

<script>

/* ESTRELAS */
const estrelasContainer = document.getElementById("estrelas");

for(let i=0;i<80;i++){
const estrela = document.createElement("div");
estrela.className="estrela";
estrela.style.top=Math.random()*100+"%";
estrela.style.left=Math.random()*100+"%";
estrela.style.animationDuration=(1+Math.random()*2)+"s";
estrelasContainer.appendChild(estrela);
}

/* CONTADOR */
const dataInicio = new Date("2026-03-02");

function atualizarTempo(){
const agora = new Date();
const diff = Math.floor((agora - dataInicio)/1000);

const anos = Math.floor(diff/(365.25*24*3600));
const meses = Math.floor((diff%(365.25*24*3600))/(30.44*24*3600));
const dias = Math.floor((diff%(30.44*24*3600))/(24*3600));
const horas = Math.floor((diff%(24*3600))/3600);
const minutos = Math.floor((diff%3600)/60);
const segundos = diff%60;

document.getElementById("tempo").innerHTML =
`${anos} anos, ${meses} meses, ${dias} dias<br>
${horas}h ${minutos}m ${segundos}s`;
}

setInterval(atualizarTempo,1000);
atualizarTempo();

/* CORAÇÕES */
function criarCoracao(){
const heart = document.createElement("div");
heart.className = "heart";
heart.innerHTML = "❤️";

heart.style.left = Math.random()*100 + "vw";
heart.style.animationDuration = (6 + Math.random()*4) + "s";

document.body.appendChild(heart);

setTimeout(()=>heart.remove(),10000);
}

setInterval(criarCoracao,600);

/* FRASES */
const frases = [
"Entre todos os girassóis do mundo, nenhum brilha mais do que o teu sorriso.",
"Você não é só parte dos meus dias… você é o melhor deles.",
"O mundo pode ser grande… mas nada nele me faz sentir tão completo quanto você."
];

const posicoes = [
{top:"5%", left:"5%"},
{top:"5%", right:"5%"},
{top:"30%", left:"5%"},
{top:"30%", right:"5%"},
{bottom:"10%", left:"5%"},
{bottom:"10%", right:"5%"}
];

let indexPosicao = 0;

function criarFrase(){
const frase = document.createElement("div");
frase.className = "frase";

frase.innerText = frases[Math.floor(Math.random()*frases.length)];

const pos = posicoes[indexPosicao];
indexPosicao = (indexPosicao + 1) % posicoes.length;

for(let key in pos){
frase.style[key] = pos[key];
}

document.body.appendChild(frase);

setTimeout(()=>frase.remove(),15000);
}

setInterval(criarFrase,5000);

/* MÚSICAS */
const musicas = [
{nome:"Música 1", arquivo:"musica1.mp3"},
{nome:"Música 2", arquivo:"musica2.mp3"},
{nome:"Música 3", arquivo:"musica3.mp3"}
];

const player = document.getElementById("musica");
const selector = document.getElementById("musicSelector");

musicas.forEach((m)=>{
const option = document.createElement("option");
option.value = m.arquivo;
option.text = m.nome;
selector.appendChild(option);
});

const randomIndex = Math.floor(Math.random()*musicas.length);
player.src = musicas[randomIndex].arquivo;
selector.selectedIndex = randomIndex;

selector.addEventListener("change", ()=>{
player.src = selector.value;
player.play();
});

player.volume = 0.3;
player.play().catch(()=>{});

</script>

</body>
</html>
